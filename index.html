<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matale Peter Molepo — Portfolio</title>
<meta name="description" content="Full Stack Developer · C# / .NET Core · Angular · Node.js · RESTful APIs">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
/* ==================== CSS VARIABLES ==================== */
:root {
  --indigo: #3d2fa0; --indigo-light: #5b47d6;
  --pink: #ff2d9b; --cyan: #00e5ff; --amber: #ffb300;
  --bg: #06060f; --bg2: #0c0c1e; --bg3: #111130;
  --text: #e8e8f0; --text-muted: #8888a8;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
}

/* ==================== RESET ==================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;cursor:none;}

/* noise overlay */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:1000;opacity:0.25;}

/* scrollbar */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--pink),var(--cyan));border-radius:3px;}

/* ==================== CURSOR ==================== */
#cursor-dot{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--cyan);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 10px var(--cyan),0 0 20px var(--cyan);transition:background .3s;}
#cursor-ring{position:fixed;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(0,229,255,.5);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .18s cubic-bezier(.23,1,.32,1);}

/* ==================== CANVAS ==================== */
#particle-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}

/* ==================== LOADER ==================== */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000;transition:opacity .8s ease,visibility .8s ease;}
#loader.hidden{opacity:0;visibility:hidden;}
.loader-initials{font-family:'Syne',sans-serif;font-size:clamp(60px,10vw,100px);font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--pink),var(--cyan),var(--amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:pulseScale 1.5s ease-in-out infinite;}
@keyframes pulseScale{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.loader-bar-wrap{margin-top:40px;width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.loader-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--pink),var(--cyan),var(--amber));border-radius:2px;animation:loaderFill 2.2s ease forwards;}
@keyframes loaderFill{0%{width:0%;}100%{width:100%;}}
.loader-text{margin-top:16px;font-size:12px;letter-spacing:4px;color:var(--text-muted);text-transform:uppercase;}

/* ==================== NAVBAR ==================== */
nav{position:fixed;top:0;left:0;right:0;z-index:800;padding:0 5vw;background:rgba(6,6,15,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);transform:translateY(-100%);animation:slideDown .6s 2.4s ease forwards;height:64px;display:flex;align-items:center;justify-content:space-between;}
@keyframes slideDown{to{transform:translateY(0);}}
.nav-logo{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;letter-spacing:-.01em;}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{color:var(--text-muted);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.02em;position:relative;padding-bottom:2px;transition:color .3s;}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1.5px;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .3s ease;}
.nav-links a:hover{color:var(--text);}
.nav-links a:hover::after{width:100%;}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:none;padding:4px;}
.hamburger span{display:block;width:22px;height:2px;background:var(--text-muted);border-radius:2px;transition:.3s;}

/* ==================== MAIN ==================== */
.page{position:relative;z-index:10;}
section{padding:100px 5vw;max-width:1200px;margin:0 auto;}

/* ==================== HERO ==================== */
#hero{min-height:100vh;display:flex;align-items:center;padding:120px 5vw 80px;gap:60px;max-width:1200px;margin:0 auto;}
.hero-left{flex:1;}
.avail-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.2);color:var(--cyan);font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border-radius:20px;margin-bottom:28px;}
.avail-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.hero-name{font-family:'Syne',sans-serif;font-size:clamp(42px,6vw,80px);font-weight:800;line-height:1.05;letter-spacing:-.03em;background:linear-gradient(135deg,#fff 0%,var(--cyan) 35%,var(--pink) 65%,var(--amber) 100%);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s ease-in-out infinite;}
@keyframes shimmer{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.hero-sub{font-size:clamp(15px,1.8vw,19px);color:var(--text-muted);margin-top:16px;font-weight:300;line-height:1.7;max-width:520px;}
.hero-ctas{display:flex;gap:16px;margin-top:36px;flex-wrap:wrap;}
.btn-primary{padding:14px 32px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;letter-spacing:.05em;text-decoration:none;background:linear-gradient(135deg,var(--pink),var(--indigo-light));color:#fff;border:none;cursor:none;box-shadow:0 8px 32px rgba(255,45,155,.3);transition:transform .2s,box-shadow .2s;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,45,155,.45);}
.btn-outline{padding:14px 32px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;letter-spacing:.05em;text-decoration:none;background:transparent;color:var(--cyan);cursor:none;border:1.5px solid rgba(0,229,255,.4);transition:background .2s,border-color .2s,transform .2s;}
.btn-outline:hover{background:rgba(0,229,255,.08);border-color:var(--cyan);transform:translateY(-2px);}

/* HERO CARD */
.hero-right{flex:0 0 320px;display:flex;justify-content:center;align-items:center;}
.card-scene{width:280px;height:340px;perspective:1000px;position:relative;}
.floating-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:float3D 6s ease-in-out infinite;border-radius:24px;background:linear-gradient(135deg,rgba(61,47,160,.5),rgba(255,45,155,.2),rgba(0,229,255,.15));border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);padding:36px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 60px rgba(61,47,160,.4);}
@keyframes float3D{0%,100%{transform:translateY(0) rotateX(4deg) rotateY(-4deg);}25%{transform:translateY(-12px) rotateX(-2deg) rotateY(6deg);}50%{transform:translateY(-8px) rotateX(4deg) rotateY(4deg);}75%{transform:translateY(-16px) rotateX(-4deg) rotateY(-6deg);}}
.card-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--indigo-light),var(--cyan));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#fff;position:relative;margin-bottom:20px;}
.spin-ring{position:absolute;inset:-10px;border-radius:50%;border:2px dashed rgba(0,229,255,.4);animation:spinRing 8s linear infinite;}
.spin-ring-2{position:absolute;inset:-18px;border-radius:50%;border:1px dashed rgba(255,45,155,.3);animation:spinRing 12s linear infinite reverse;}
@keyframes spinRing{to{transform:rotate(360deg);}}
.glow-orb{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(61,47,160,.6) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-70%);pointer-events:none;}
.card-role{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:24px;text-align:center;}
.card-stats{width:100%;display:flex;flex-direction:column;gap:10px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);}
.stat-label{font-size:11px;color:var(--text-muted);letter-spacing:.05em;}
.stat-value{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--amber);}
.stat-value.highlight{color:var(--cyan);}

/* ==================== SECTION HEADER ==================== */
.section-header{text-align:center;margin-bottom:64px;}
.section-tag{display:inline-block;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--pink);margin-bottom:12px;font-weight:500;}
.section-title{font-family:'Syne',sans-serif;font-size:clamp(30px,4vw,50px);font-weight:800;letter-spacing:-.02em;line-height:1.1;background:linear-gradient(135deg,#fff,rgba(255,255,255,.6));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.section-line{width:60px;height:3px;margin:18px auto 0;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:2px;}

/* ==================== MARQUEE ==================== */
.marquee-wrap{overflow:hidden;padding:28px 0;border-top:1px solid var(--glass-border);border-bottom:1px solid var(--glass-border);background:var(--glass);}
.marquee-track{display:flex;gap:56px;width:max-content;animation:marqueeScroll 20s linear infinite;}
.marquee-track:hover{animation-play-state:paused;}
@keyframes marqueeScroll{to{transform:translateX(-50%);}}
.marquee-item{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;display:flex;align-items:center;gap:14px;}
.marquee-item::after{content:'◆';color:var(--pink);font-size:8px;}

/* ==================== SKILLS ==================== */
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px 56px;margin-bottom:56px;}
.skill-meta{display:flex;justify-content:space-between;margin-bottom:8px;}
.skill-name{font-size:13px;font-weight:500;letter-spacing:.04em;}
.skill-pct{font-size:12px;color:var(--text-muted);font-family:'Syne',sans-serif;}
.skill-track{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.skill-bar{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--indigo-light),var(--pink));transition:width 1.2s cubic-bezier(.22,1,.36,1);}
.skill-bar.shimmer-done{background:linear-gradient(90deg,var(--indigo-light),var(--pink),var(--cyan));background-size:200% 100%;animation:shimmerBar 1.8s ease .3s both;}
@keyframes shimmerBar{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.chips-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:22px;text-align:center;}
.chips-cloud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.chip{padding:7px 16px;border-radius:6px;font-size:12px;font-weight:500;letter-spacing:.03em;border:1px solid var(--glass-border);background:var(--glass);color:var(--text-muted);transition:transform .25s,color .25s,border-color .25s,box-shadow .25s;}
.chip:hover{transform:translateY(-4px);color:var(--cyan);border-color:rgba(0,229,255,.4);box-shadow:0 8px 24px rgba(0,229,255,.15);}

/* ==================== TIMELINE ==================== */
.timeline{position:relative;padding-left:32px;}
.timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--pink),var(--cyan),var(--amber));border-radius:2px;}
.tl-item{position:relative;margin-bottom:48px;opacity:0;transform:translateX(-30px);transition:opacity .6s ease,transform .6s ease;}
.tl-item.visible{opacity:1;transform:translateX(0);}
.tl-dot{position:absolute;left:-38px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--pink);box-shadow:0 0 10px rgba(255,45,155,.5);}
.tl-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:26px 28px;transition:transform .3s,box-shadow .3s;}
.tl-card:hover{transform:translateX(8px);box-shadow:-6px 0 40px rgba(61,47,160,.3),0 8px 32px rgba(0,0,0,.4);}
.tl-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;}
.tl-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:#fff;}
.tl-badge{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px;font-weight:600;}
.badge-pink{background:rgba(255,45,155,.15);color:var(--pink);border:1px solid rgba(255,45,155,.3);}
.badge-cyan{background:rgba(0,229,255,.12);color:var(--cyan);border:1px solid rgba(0,229,255,.25);}
.badge-amber{background:rgba(255,179,0,.12);color:var(--amber);border:1px solid rgba(255,179,0,.25);}
.tl-company{font-size:14px;color:var(--text-muted);margin-bottom:4px;}
.tl-date{font-size:12px;color:var(--text-muted);margin-bottom:16px;letter-spacing:.04em;}
.tl-bullets{list-style:none;display:flex;flex-direction:column;gap:8px;}
.tl-bullets li{font-size:13px;color:rgba(232,232,240,.75);line-height:1.65;padding-left:18px;position:relative;}
.tl-bullets li::before{content:'▸';position:absolute;left:0;color:var(--pink);font-size:11px;top:3px;}
.highlight-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.hchip{font-size:11px;padding:3px 10px;border-radius:4px;font-weight:500;background:rgba(61,47,160,.25);color:var(--indigo-light);border:1px solid rgba(91,71,214,.3);}

/* ==================== PROJECTS ==================== */
.projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.proj-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:26px 22px;position:relative;overflow:hidden;opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease,box-shadow .3s;}
.proj-card.visible{opacity:1;transform:translateY(0);}
.proj-card:hover{transform:translateY(-6px);box-shadow:0 20px 60px rgba(0,0,0,.5);}
.proj-top-border{position:absolute;top:0;left:-100%;right:100%;height:2px;background:linear-gradient(90deg,var(--pink),var(--cyan),var(--amber));transition:left .5s ease,right .5s ease;}
.proj-card:hover .proj-top-border{left:0;right:0;}
.proj-emoji{font-size:34px;margin-bottom:14px;display:block;}
.proj-name{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:10px;color:#fff;}
.proj-desc{font-size:13px;color:var(--text-muted);line-height:1.65;margin-bottom:16px;}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;}
.proj-tag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:4px;background:rgba(255,179,0,.1);color:var(--amber);border:1px solid rgba(255,179,0,.2);}
.proj-link{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12px;color:var(--cyan);text-decoration:none;letter-spacing:.04em;transition:gap .2s;}
.proj-link:hover{gap:10px;}

/* ==================== DATA SCIENCE ==================== */
.ds-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:40px;}
.ds-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:24px;position:relative;overflow:hidden;opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease;}
.ds-card.visible{opacity:1;transform:translateY(0);}
.ds-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--amber));}
.ds-icon{font-size:28px;margin-bottom:12px;display:block;}
.ds-card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:8px;color:#fff;}
.ds-card-text{font-size:13px;color:var(--text-muted);line-height:1.65;}
.ds-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.ds-tool{font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:4px;background:rgba(0,229,255,.08);color:var(--cyan);border:1px solid rgba(0,229,255,.2);}

/* ==================== EDUCATION ==================== */
.edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.edu-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:26px;opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease;}
.edu-card.visible{opacity:1;transform:translateY(0);}
.edu-degree{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:8px;color:#fff;}
.edu-school{font-size:13px;color:var(--cyan);margin-bottom:4px;}
.edu-meta{font-size:12px;color:var(--text-muted);margin-bottom:14px;}
.edu-score{display:inline-flex;align-items:center;gap:8px;background:rgba(255,179,0,.1);border:1px solid rgba(255,179,0,.25);color:var(--amber);font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;letter-spacing:.04em;}
.edu-modules{margin-top:14px;font-size:12px;color:var(--text-muted);line-height:1.75;}
.edu-modules span{color:rgba(232,232,240,.6);}
.edu-extra{margin-top:12px;font-size:13px;color:var(--amber);}
.lang-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px;}
.lang-badges{display:flex;flex-wrap:wrap;gap:12px;}
.lang-badge{display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-border);}
.lang-flag{font-size:20px;}
.lang-name{font-size:14px;font-weight:500;color:#fff;}
.lang-level{font-size:11px;color:var(--text-muted);}

/* ==================== CONTACT ==================== */
.contact-inner{display:flex;gap:60px;align-items:flex-start;}
.contact-left{flex:1;display:flex;flex-direction:column;gap:14px;}
.contact-card{display:flex;align-items:center;gap:16px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:16px 20px;transition:transform .25s,box-shadow .25s;}
.contact-card:hover{transform:translateX(8px);box-shadow:0 8px 32px rgba(61,47,160,.3);}
.contact-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.ci-pink{background:rgba(255,45,155,.12);}
.ci-cyan{background:rgba(0,229,255,.1);}
.ci-amber{background:rgba(255,179,0,.1);}
.ci-indigo{background:rgba(91,71,214,.15);}
.contact-label{font-size:11px;color:var(--text-muted);letter-spacing:.04em;margin-bottom:2px;}
.contact-value{font-size:14px;font-weight:500;color:#fff;}
.contact-right{flex:0 0 280px;display:flex;align-items:center;justify-content:center;position:relative;height:280px;}
.contact-avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--pink));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:#fff;position:relative;z-index:2;}
.ripple{position:absolute;border-radius:50%;border:1.5px solid rgba(255,45,155,.3);animation:rippleOut 3s ease-out infinite;}
.ripple:nth-child(1){width:140px;height:140px;animation-delay:0s;}
.ripple:nth-child(2){width:190px;height:190px;animation-delay:.9s;}
.ripple:nth-child(3){width:240px;height:240px;animation-delay:1.8s;}
@keyframes rippleOut{0%{opacity:.6;transform:scale(.85);}100%{opacity:0;transform:scale(1.1);}}

/* ==================== FOOTER ==================== */
footer{text-align:center;padding:36px 5vw 48px;border-top:1px solid var(--glass-border);color:var(--text-muted);font-size:13px;position:relative;z-index:10;}
footer span{color:var(--pink);}

/* ==================== SCROLL REVEAL ==================== */
.reveal{opacity:0;transform:translateY(40px);transition:opacity .7s ease,transform .7s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}
.reveal-left{opacity:0;transform:translateX(-40px);transition:opacity .7s ease,transform .7s ease;}
.reveal-left.visible{opacity:1;transform:translateX(0);}
.reveal-right{opacity:0;transform:translateX(40px);transition:opacity .7s ease,transform .7s ease;}
.reveal-right.visible{opacity:1;transform:translateX(0);}

/* ==================== RESPONSIVE ==================== */
@media(max-width:900px){
  #hero{flex-direction:column;text-align:center;padding-top:110px;}
  .hero-right{width:100%;justify-content:center;margin-top:40px;}
  .hero-ctas{justify-content:center;}
  .skills-grid{grid-template-columns:1fr;}
  .projects-grid{grid-template-columns:1fr 1fr;}
  .edu-grid{grid-template-columns:1fr;}
  .ds-grid{grid-template-columns:1fr;}
  .contact-inner{flex-direction:column;}
  .contact-right{width:100%;}
}
@media(max-width:620px){
  .nav-links{display:none;}
  .hamburger{display:flex;}
  .nav-links.open{display:flex;flex-direction:column;position:fixed;top:64px;left:0;right:0;background:rgba(6,6,15,.97);padding:24px 5vw;gap:20px;border-bottom:1px solid var(--glass-border);}
  .projects-grid{grid-template-columns:1fr;}
}

/* ==================== ERROR STATE ==================== */
.load-error{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:16px;}
.load-error h2{font-family:'Syne',sans-serif;font-size:24px;color:var(--pink);}
.load-error p{color:var(--text-muted);font-size:14px;max-width:400px;line-height:1.7;}
.load-error code{font-size:13px;background:var(--glass);padding:4px 10px;border-radius:4px;color:var(--cyan);}
</style>
</head>
<body>

<!-- CURSOR -->
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<!-- CANVAS -->
<canvas id="particle-canvas"></canvas>

<!-- LOADER -->
<div id="loader">
  <div class="loader-initials" id="loader-initials">···</div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
  <div class="loader-text">Loading Portfolio</div>
</div>

<!-- NAV -->
<nav id="navbar">
  <a href="#hero" class="nav-logo" id="nav-logo">Portfolio</a>
  <ul class="nav-links" id="nav-links">
    <li><a href="#skills">Skills</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#datascience">Data Science</a></li>
    <li><a href="#education">Education</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <div class="hamburger" id="hamburger" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
</nav>

<!-- PAGE -->
<div class="page" id="page-content">
  <!-- Populated by JS after JSON loads -->
</div>

<footer id="site-footer"></footer>

<script>
/* ======================================================
   PORTFOLIO — DATA-DRIVEN FROM portfolio-data.json
   Edit portfolio-data.json to update content.
   No changes needed in this file.
   ====================================================== */

const DATA_URL = './portfolio-data.json';

/* ==================== CURSOR ==================== */
const dot = document.getElementById('cursor-dot');
const ring = document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function animCursor(){
  dot.style.left=mx+'px';dot.style.top=my+'px';
  rx+=(mx-rx)*.12;ry+=(my-ry)*.12;
  ring.style.left=rx+'px';ring.style.top=ry+'px';
  requestAnimationFrame(animCursor);
})();

/* ==================== PARTICLES ==================== */
const canvas=document.getElementById('particle-canvas');
const ctx=canvas.getContext('2d');
let W,H,particles=[];
const COLORS=['#3d2fa0','#ff2d9b','#00e5ff','#ffb300','#5b47d6'];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
function Particle(){
  this.reset=function(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.5;this.vy=(Math.random()-.5)*.5;this.r=Math.random()*2+1;this.color=COLORS[Math.floor(Math.random()*COLORS.length)];this.alpha=Math.random()*.5+.2;};
  this.reset();
  this.update=function(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1;};
  this.draw=function(){ctx.save();ctx.globalAlpha=this.alpha;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();};
}
for(let i=0;i<80;i++)particles.push(new Particle());
(function animP(){
  ctx.clearRect(0,0,W,H);
  particles.forEach(p=>{p.update();p.draw();});
  for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){
    const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<130){ctx.save();ctx.globalAlpha=(1-d/130)*.15;ctx.strokeStyle=particles[i].color;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke();ctx.restore();}
  }
  requestAnimationFrame(animP);
})();

/* ==================== HAMBURGER ==================== */
function toggleMenu(){document.getElementById('nav-links').classList.toggle('open');}

/* ==================== INTERSECTION OBSERVER ==================== */
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('visible');}
  });
},{threshold:0.1});

function observeAll(){
  document.querySelectorAll('.reveal,.reveal-left,.reveal-right,.tl-item,.proj-card,.edu-card,.ds-card').forEach(el=>io.observe(el));
}

/* Skill bars trigger */
const skillIO = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting) animateBars();
  });
},{threshold:0.2});

function animateBars(){
  document.querySelectorAll('.skill-bar').forEach(bar=>{
    bar.style.width=bar.dataset.pct+'%';
    setTimeout(()=>bar.classList.add('shimmer-done'),1300);
  });
}

/* ==================== HTML BUILDERS ==================== */
function buildPage(d){
  const pc=document.getElementById('page-content');
  pc.innerHTML=`
    ${heroHTML(d)}
    ${marqueeHTML(d.marquee)}
    ${skillsHTML(d.skills,d.chips)}
    ${experienceHTML(d.experience)}
    ${projectsHTML(d.projects)}
    ${dsHTML(d.datascience)}
    ${educationHTML(d.education,d.languages)}
    ${contactHTML(d.contact,d.meta)}
  `;

  /* Nav logo & footer */
  document.getElementById('nav-logo').textContent=d.meta.name.split(' ')[0];
  document.getElementById('loader-initials').textContent=d.meta.initials;
  document.title=`${d.meta.name} — ${d.meta.title}`;
  document.getElementById('site-footer').innerHTML=
    `<p>Designed & built by <span>${d.meta.name}</span> · ${d.meta.title} · <span>SA Citizen</span></p>`;

  observeAll();
  skillIO.observe(document.getElementById('skills'));
  setTimeout(()=>{document.getElementById('loader').classList.add('hidden');},2300);
}

function heroHTML(d){
  const statsHTML=d.stats.map(s=>`
    <div class="stat-row">
      <span class="stat-label">${s.label}</span>
      <span class="stat-value${s.highlight?' highlight':''}">${s.value}</span>
    </div>`).join('');
  return `
  <div id="hero">
    <div class="hero-left">
      <div class="avail-tag">
        <div class="avail-dot" style="${d.meta.available?'':'background:var(--amber);animation:none;'}"></div>
        ${d.meta.availabilityText}
      </div>
      <h1 class="hero-name">${d.meta.name.replace(/ /g,'<br>')}</h1>
      <p class="hero-sub">${d.meta.subtitle}</p>
      <div class="hero-ctas">
        <a href="#contact" class="btn-primary">Get In Touch</a>
        <a href="#projects" class="btn-outline">View Projects</a>
      </div>
    </div>
    <div class="hero-right">
      <div class="card-scene">
        <div class="floating-card">
          <div class="glow-orb"></div>
          <div class="card-avatar">
            ${d.meta.initials}
            <div class="spin-ring"></div>
            <div class="spin-ring-2"></div>
          </div>
          <div class="card-role">${d.meta.title}</div>
          <div class="card-stats">${statsHTML}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function marqueeHTML(items){
  const doubled=[...items,...items];
  const html=doubled.map(i=>`<span class="marquee-item">${i}</span>`).join('');
  return `<div class="marquee-wrap"><div class="marquee-track">${html}</div></div>`;
}

function skillsHTML(skills,chips){
  const barsHTML=skills.map(s=>`
    <div class="skill-item">
      <div class="skill-meta"><span class="skill-name">${s.name}</span><span class="skill-pct">${s.pct}%</span></div>
      <div class="skill-track"><div class="skill-bar" data-pct="${s.pct}"></div></div>
    </div>`).join('');
  const chipsHTML=chips.map(c=>`<span class="chip">${c}</span>`).join('');
  return `
  <section id="skills">
    <div class="section-header reveal">
      <div class="section-tag">What I Bring</div>
      <h2 class="section-title">Technical Skills</h2>
      <div class="section-line"></div>
    </div>
    <div class="skills-grid reveal">${barsHTML}</div>
    <div class="reveal">
      <div class="chips-title">Technology Stack</div>
      <div class="chips-cloud">${chipsHTML}</div>
    </div>
  </section>`;
}

function experienceHTML(exp){
  const tlHTML=exp.map((e,i)=>`
    <div class="tl-item" style="transition-delay:${i*.1}s">
      <div class="tl-dot"></div>
      <div class="tl-card">
        <div class="tl-header">
          <div class="tl-title">${e.title}</div>
          <span class="tl-badge ${e.badge.cls}">${e.badge.text}</span>
        </div>
        <div class="tl-company">${e.company} · ${e.location}</div>
        <div class="tl-date">${e.dates}</div>
        <ul class="tl-bullets">${e.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
        <div class="highlight-chips">${e.chips.map(c=>`<span class="hchip">${c}</span>`).join('')}</div>
      </div>
    </div>`).join('');
  return `
  <section id="experience">
    <div class="section-header reveal">
      <div class="section-tag">Work History</div>
      <h2 class="section-title">Experience</h2>
      <div class="section-line"></div>
    </div>
    <div class="timeline">${tlHTML}</div>
  </section>`;
}

function projectsHTML(projs){
  const grid=projs.map((p,i)=>`
    <div class="proj-card" style="transition-delay:${i*.08}s">
      <div class="proj-top-border"></div>
      <span class="proj-emoji">${p.emoji}</span>
      <div class="proj-name">${p.name}</div>
      <div class="proj-desc">${p.desc}</div>
      <div class="proj-tags">${p.tags.map(t=>`<span class="proj-tag">${t}</span>`).join('')}</div>
      ${p.link?`<a href="${p.link}" class="proj-link" target="_blank" rel="noopener">View Project →</a>`:''}
    </div>`).join('');
  return `
  <section id="projects">
    <div class="section-header reveal">
      <div class="section-tag">What I've Built</div>
      <h2 class="section-title">Projects</h2>
      <div class="section-line"></div>
    </div>
    <div class="projects-grid">${grid}</div>
  </section>`;
}

function dsHTML(cards){
  const grid=cards.map(c=>`
    <div class="ds-card">
      <span class="ds-icon">${c.icon}</span>
      <div class="ds-card-title">${c.title}</div>
      <div class="ds-card-text">${c.text}</div>
      <div class="ds-tools">${c.tools.map(t=>`<span class="ds-tool">${t}</span>`).join('')}</div>
    </div>`).join('');
  return `
  <section id="datascience">
    <div class="section-header reveal">
      <div class="section-tag">Analytics & Insight</div>
      <h2 class="section-title">Data Science Background</h2>
      <div class="section-line"></div>
    </div>
    <div class="ds-grid">${grid}</div>
  </section>`;
}

function educationHTML(edu,langs){
  const eduCards=edu.map(e=>`
    <div class="edu-card">
      <div class="edu-degree">${e.degree}</div>
      <div class="edu-school">${e.school}</div>
      <div class="edu-meta">${e.meta}</div>
      <div class="edu-score">🏅 ${e.score}</div>
      <div class="edu-modules"><strong>Key Modules:</strong><br><span>${e.modules}</span></div>
      <div class="edu-extra">${e.extra}</div>
    </div>`).join('');

  const langHTML=langs.map(l=>`
    <div class="lang-badge">
      <span class="lang-flag">${l.flag}</span>
      <div><div class="lang-name">${l.name}</div><div class="lang-level">${l.level}</div></div>
    </div>`).join('');

  return `
  <section id="education">
    <div class="section-header reveal">
      <div class="section-tag">Academic Background</div>
      <h2 class="section-title">Education</h2>
      <div class="section-line"></div>
    </div>
    <div class="edu-grid">${eduCards}</div>
    <div class="reveal" style="margin-top:40px;">
      <div class="lang-title">Languages</div>
      <div class="lang-badges">${langHTML}</div>
    </div>
  </section>`;
}

function contactHTML(c,m){
  const cards=[
    {icon:'📧',cls:'ci-pink',label:'Email',value:c.email},
    {icon:'📱',cls:'ci-cyan',label:'Phone',value:c.phone},
    {icon:'📍',cls:'ci-amber',label:'Location',value:c.location},
    {icon:'💼',cls:'ci-indigo',label:'GitHub',value:c.github},
    ...(c.linkedin?[{icon:'🔗',cls:'ci-cyan',label:'LinkedIn',value:c.linkedin}]:[]),
    {icon:'🏆',cls:'ci-pink',label:'IITPSA Membership',value:c.iitpsa},
    {icon:'🚗',cls:'ci-cyan',label:"Driver's Licence",value:c.licence},
  ].map(card=>`
    <div class="contact-card">
      <div class="contact-icon ${card.cls}">${card.icon}</div>
      <div>
        <div class="contact-label">${card.label}</div>
        <div class="contact-value">${card.value}</div>
      </div>
    </div>`).join('');

  return `
  <section id="contact">
    <div class="section-header reveal">
      <div class="section-tag">Let's Connect</div>
      <h2 class="section-title">Get In Touch</h2>
      <div class="section-line"></div>
    </div>
    <div class="contact-inner">
      <div class="contact-left reveal-left">${cards}</div>
      <div class="contact-right reveal-right">
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="contact-avatar">${m.initials}</div>
      </div>
    </div>
  </section>`;
}

/* ==================== FETCH & INIT ==================== */
fetch(DATA_URL)
  .then(r=>{
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(data=>{
    buildPage(data);
  })
  .catch(err=>{
    console.error('Failed to load portfolio data:',err);
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('page-content').innerHTML=`
      <div class="load-error">
        <h2>⚠️ Could not load portfolio data</h2>
        <p>Make sure <code>portfolio-data.json</code> is in the same folder as <code>index.html</code> and the site is served over HTTP (not opened as a local file).</p>
        <p style="color:rgba(255,255,255,.3);font-size:12px">${err.message}</p>
      </div>`;
  });
</script>
</body>
</html>
